version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ipl_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-ipl_prediction}
      MYSQL_USER: ${DB_USER:-ipl_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ipl_password}
      MYSQL_INITIATION_LATENCY: 60
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - ipl_network

  redis:
    image: redis:7-alpine
    container_name: ipl_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
      interval: 5s
    networks:
      - ipl_network

  flask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipl_flask
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DEBUG: ${DEBUG:-False}
      DATABASE_URL: mysql+pymysql://${DB_USER:-ipl_user}:${DB_PASSWORD:-ipl_password}@mysql:3306/${DB_NAME:-ipl_prediction}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-jwt-secret-key-change}
      CACHE_REDIS_URL: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      timeout: 10s
      retries: 5
      interval: 10s
    networks:
      - ipl_network

  nginx:
    image: nginx:alpine
    container_name: ipl_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certificates:/etc/nginx/certificates:ro
    depends_on:
      - flask
    networks:
      - ipl_network

volumes:
  mysql_data:
    driver: local

networks:
  ipl_network:
    driver: bridge
